<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monster Detective 怪獸大搜查</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Comic Sans MS', sans-serif;
      background: linear-gradient(135deg, #e0f7fa 0%, #fff9c4 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #game-container {
      width: 100%;
      max-width: 800px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* Header & Progress */
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #ffffff;
      padding: 12px 24px;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .level-badge {
      font-size: 1.2rem;
      font-weight: bold;
      color: #0288d1;
    }
    .stamps {
      display: flex;
      gap: 10px;
    }
    .stamp {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      border: 2px dashed #9e9e9e;
    }
    .stamp.active {
      background-color: #ffd54f;
      border: 2px solid #ffa000;
    }

    /* Clue Banner */
    .clue-card {
      width: 100%;
      background: #ffffff;
      border: 4px solid #4fc3f7;
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
      margin-bottom: 25px;
      position: relative;
    }
    .clue-title {
      font-size: 1rem;
      color: #757575;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .clue-text {
      font-size: 1.6rem;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 12px;
    }
    .clue-text span.highlight {
      color: #e91e63;
      text-decoration: underline;
    }
    .audio-btn {
      background-color: #4caf50;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 8px rgba(76,175,80,0.3);
      transition: transform 0.1s;
    }
    .audio-btn:active {
      transform: scale(0.95);
    }

    /* Monster Grid */
    .monster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      width: 100%;
    }
    .monster-card {
      background: white;
      border-radius: 20px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
      border: 4px solid transparent;
      transition: all 0.2s ease;
      min-height: 220px;
      position: relative;
    }
    .monster-card:hover {
      transform: translateY(-5px);
      border-color: #81c784;
    }
    .monster-card.wrong {
      animation: shake 0.4s ease;
      opacity: 0.3;
      pointer-events: none;
    }

    /* CSS Monster Drawing Base */
    .monster-body {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50px;
      margin: auto;
    }
    .eyes {
      display: flex;
      gap: 8px;
      z-index: 2;
    }
    .eye {
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #333;
    }
    .pupil {
      background: #333;
      border-radius: 50%;
    }
    .arms {
      position: absolute;
      width: 120%;
      display: flex;
      justify-content: space-between;
      top: 40%;
      z-index: 1;
    }
    .arm {
      background-color: inherit;
      border-radius: 10px;
      border: 2px solid rgba(0,0,0,0.1);
    }
    .legs {
      position: absolute;
      bottom: -20px;
      display: flex;
      gap: 20px;
    }
    .leg {
      background-color: inherit;
      border-radius: 10px;
      border: 2px solid rgba(0,0,0,0.1);
    }

    /* Variations */
    /* Size */
    .body-big { width: 110px; height: 130px; }
    .body-small { width: 60px; height: 70px; }
    /* Shape */
    .body-fat { width: 120px; height: 110px; border-radius: 60px; }
    .body-thin { width: 50px; height: 130px; border-radius: 30px; }
    /* Eyes */
    .eye-big { width: 36px; height: 36px; }
    .eye-big .pupil { width: 18px; height: 18px; }
    .eye-small { width: 16px; height: 16px; }
    .eye-small .pupil { width: 8px; height: 8px; }
    /* Arms */
    .arm-long { width: 35px; height: 14px; }
    .arm-short { width: 15px; height: 12px; }
    /* Legs */
    .leg-long { width: 14px; height: 40px; }
    .leg-short { width: 12px; height: 15px; }
